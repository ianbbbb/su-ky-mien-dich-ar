<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Sử ký Miễn dịch AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .guide {
      position: fixed;
      z-index: 9999;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: rgba(0,0,0,0.65);
      color: white;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div class="guide">
    🛡️ Hãy đưa camera vào thẻ Sử ký Miễn dịch
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

  <a-assets>
  <a-asset-item
    id="macrophageModel"
    src="./d1b16bef-b75c-48e4-8e39-86ac9f1971fd.glb">
  </a-asset-item>
</a-assets>

<a-entity mindar-image-target="targetIndex: 0">

  <a-gltf-model
    src="#macrophageModel"
    position="0 0 0"
    rotation="90 0 0"
    scale="0.3 0.3 0.3">
  </a-gltf-model>

</a-entity>

    <!-- Camera AR -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>

</body>
</html>
